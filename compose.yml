services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/team-splitter.db
    volumes:
      - ./data:/app/data
    logging:
      options:
        max-size: 10m
        max-file: "3"

  # 건의 게시판. 외부 연결은 서버의 _proxy(Caddy)가 proxy 네트워크로 한다.
  web:
    build: .
    restart: unless-stopped
    command: ["node", "dist/web/main.js"]
    env_file: .env
    environment:
      DB_PATH: /app/data/board.db
      BOARD_BASE_URL: https://team-splitter.hwiii.com
    volumes:
      - ./data:/app/data
    mem_limit: 128m
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - proxy

networks:
  proxy:
    external: true
