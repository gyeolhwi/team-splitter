services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/team-splitter.db
    volumes:
      - ./data:/app/data
    logging:
      options:
        max-size: 10m
        max-file: "3"

  # 피드백 게시판. 외부 연결은 서버의 _proxy(Caddy)가 proxy 네트워크로 한다.
  web:
    build: .
    restart: unless-stopped
    command: ["node", "dist/web/main.js"]
    # 인터넷에 노출되므로 .env 전체가 아니라 필요한 값만 넘긴다 (봇 토큰은 관리자 DM용)
    environment:
      DB_PATH: /app/data/board.db
      BOARD_BASE_URL: https://team-splitter.hwiii.com
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      ALLOWED_IDS: ${ALLOWED_IDS}
      ADMIN_ID: ${ADMIN_ID}
      SESSION_SECRET: ${SESSION_SECRET}
    # 봇 DB가 보이지 않게 게시판 전용 폴더만 연결한다. 실행 전에 mkdir -p data/board
    volumes:
      - ./data/board:/app/data
    mem_limit: 128m
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - proxy

networks:
  proxy:
    external: true
